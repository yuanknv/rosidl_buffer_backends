[package]
name = "cuda_buffer_rs"
version = "0.1.0"
authors = ["Yuankun Zhu <yuankunz@nvidia.com>"]
edition = "2021"
license = "Apache-2.0"
description = "Rust bindings for the CUDA-backed rosidl::Buffer C ABI"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[features]
default = []
cuda-core = ["dep:cuda-core"]

[dependencies]
rosidl_runtime_rs = "0.6"
cuda-core = { version = "=0.3.1", optional = true }

[dev-dependencies]
rclrs = { version = "0.7", features = ["serde"] }
ros-env = "=0.2.0"
serde_json = "1"

[[test]]
name = "cuda_core"
required-features = ["cuda-core"]

[[test]]
name = "pubsub"
required-features = ["cuda-core"]

[[test]]
name = "sequence"
required-features = ["cuda-core"]

[[test]]
name = "buffer_messages"
required-features = ["cuda-core"]

[[example]]
name = "cuda_image_publisher"
required-features = ["cuda-core"]

[[example]]
name = "cuda_image_subscriber"
required-features = ["cuda-core"]

[[test]]
name = "copy"
required-features = ["cuda-core"]
